<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WTS Result Management System</title>
<meta http-equiv="refresh" content="0;url=portal_core.html?sso=1&handoff=20260911c"/>
<script>
window.location.replace('portal_core.html?sso=1&handoff=20260911c');
</script>
<style>
  html,body{margin:0;min-height:100%;background:#f0f7f4;font-family:Arial,sans-serif;color:#1a2a4a}
  main{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
  a{display:inline-block;background:#1a2a4a;color:#fff;text-decoration:none;border-radius:9px;padding:11px 16px;font-weight:700}
</style>
</head>
<body>

<!-- 3D intro (JS-driven, ~5.5s, tap to skip) -->
<style>
html.pintro-lock{overflow:hidden}
.portalIntro{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;background:radial-gradient(120% 90% at 50% 20%,#0d2a4d 0%,#071527 55%,#030b16 100%);cursor:pointer;overflow:hidden;perspective:1100px}
.portalIntro__scene{position:relative;width:190px;height:190px;transform-style:preserve-3d;will-change:transform}
.portalIntro__badge{position:absolute;inset:0;border-radius:50%;background:linear-gradient(150deg,#f8fbff,#cfe0f2 60%,#9fbcd8);box-shadow:0 24px 60px rgba(2,12,26,.55),0 0 0 1px rgba(255,255,255,.35) inset;display:flex;align-items:center;justify-content:center;will-change:transform,opacity}
.portalIntro__badge img{width:74%;height:74%;object-fit:contain;border-radius:50%}
.portalIntro__ring{position:absolute;inset:-26px;border-radius:50%;border:2px solid rgba(120,190,255,.5);opacity:.8}
.portalIntro__ring--second{inset:-48px;border-color:rgba(120,190,255,.22);opacity:.5}
.portalIntro__wordmark{display:flex;gap:.45em;font-size:clamp(1.5rem,6vw,2.4rem);font-weight:800;color:#eef6ff}
.portalIntro__word{display:inline-block;opacity:0;will-change:transform,opacity;text-shadow:0 2px 24px rgba(96,180,255,.4)}
.portalIntro__sub{margin:0;color:#8fbede;font-size:.95rem;letter-spacing:.18em;text-transform:uppercase;opacity:0}
.portalIntro__skip{position:absolute;right:18px;bottom:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#cfe4f6;padding:.45rem 1.1rem;border-radius:999px;font-size:.85rem}
</style>
<div class="portalIntro" id="portalIntro" role="presentation">
  <div class="portalIntro__scene" id="pintroScene">
    <div class="portalIntro__ring" id="pintroRing1"></div>
    <div class="portalIntro__ring portalIntro__ring--second" id="pintroRing2"></div>
    <div class="portalIntro__badge" id="pintroBadge"><img src="/public-school-logo.webp" alt=""></div>
  </div>
  <div class="portalIntro__wordmark"><span class="portalIntro__word" id="pintroW1">Way</span> <span class="portalIntro__word" id="pintroW2">to</span> <span class="portalIntro__word" id="pintroW3">Success</span></div>
  <p class="portalIntro__sub" id="pintroSub">Standard Schools &middot; Ejigbo</p>
  <button class="portalIntro__skip" type="button" id="pintroSkip">Skip</button>
</div>
<script>
(function(){
  var el=document.getElementById('portalIntro');if(!el)return;
  document.documentElement.classList.add('pintro-lock');
  var badge=document.getElementById('pintroBadge'),scene=document.getElementById('pintroScene');
  var rings=[document.getElementById('pintroRing1'),document.getElementById('pintroRing2')];
  var words=[document.getElementById('pintroW1'),document.getElementById('pintroW2'),document.getElementById('pintroW3')];
  var sub=document.getElementById('pintroSub');
  var DUR=5200,FULL=DUR+800,skipped=false,started=null;
  function ease(t){return 1-Math.pow(1-t,3);}
  function set(o,k,v){o.style.opacity=v;}
  function frame(now){
    if(started===null)started=now;
    var t=Math.min(Math.max((now-started)/DUR,0),1);
    var b,inT=Math.min(t/0.5,1);
    if(t<0.5){b=1-ease(inT);}else{b=0.06*Math.sin((t-0.5)*12.56);}
    badge.style.opacity=String(Math.min(1,inT*2.2));
    badge.style.transform='rotateY('+((1-ease(inT))*360)+'deg) scale('+(0.55+0.45*ease(inT))+')'+(t>=0.5?' rotateZ('+(b*3)+'deg) rotateY('+(b*12)+'deg)':'');
    scene.style.transform='translateZ(0) scale('+(0.7+0.3*ease(Math.min(t/0.7,1)))+')';
    var r1=0.8*ease(Math.min(t/0.45,1))*(1+0.3*Math.sin(t*6.28));
    rings[0].style.transform='rotateX(72deg) scale('+(0.35+0.8*ease(Math.min(t/0.45,1)))+')';
    rings[0].style.opacity=String(Math.max(0,0.85-t*0.6));
    rings[1].style.transform='rotateX(72deg) scale('+(0.3+0.85*ease(Math.min(Math.max(t-0.08,0)/0.5,1)))+')';
    rings[1].style.opacity=String(Math.max(0,0.5-t*0.4));
    var wl=[1.35/5.2,1.6/5.2,1.85/5.2];
    for(var i=0;i<words.length;i++){
      var wt=Math.min(Math.max((t-wl[i])/0.17,0),1),e=1-Math.pow(1-wt,3);
      words[i].style.opacity=String(e);
      words[i].style.transform='translateY('+((1-e)*26)+'px) rotateX('+((1-e)*75)+'deg)';
    }
    sub.style.opacity=String(Math.min(Math.max((t-2.5/5.2)/0.19,0),1));
    el.style.background='radial-gradient(120% 90% at 50% 20%,#0d2a4d 0%,#071527 55%,#030b16 100%)';
    if(now-started<DUR&&!skipped){requestAnimationFrame(frame);}
    else{out();}
  }
  function out(){
    if(skipped)return;skipped=true;
    var o=1;var iv=setInterval(function(){o-=0.12;el.style.opacity=String(Math.max(0,o));el.style.transform='scale('+(1+(1-Math.max(0,o))*0.18)+')';if(o<=0){clearInterval(iv);el.remove();document.documentElement.classList.remove('pintro-lock');if(window.portalIntroDone)window.portalIntroDone();}},40);
  }
  window.portalIntroEnd=out;
  el.addEventListener('click',out);
  requestAnimationFrame(frame);
})();
</script>

<main><a href="portal_core.html?sso=1&handoff=20260911c">Open WTS Result Portal</a></main>
</body>
</html>
