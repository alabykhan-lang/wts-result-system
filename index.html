<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WTS Result Management System</title>
<meta http-equiv="refresh" content="0;url=portal_core.html?sso=1&handoff=20260911c"/>
<script>
window.location.replace('portal_core.html?sso=1&handoff=20260911c');
</script>
<style>
  html,body{margin:0;min-height:100%;background:#f0f7f4;font-family:Arial,sans-serif;color:#1a2a4a}
  main{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
  a{display:inline-block;background:#1a2a4a;color:#fff;text-decoration:none;border-radius:9px;padding:11px 16px;font-weight:700}
</style>
</head>
<body>

<!-- 3D intro (5.5s, tap to skip) -->
<style>
html:has(.portalIntro){overflow:hidden}
.portalIntro{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;background:radial-gradient(120% 90% at 50% 20%,#0d2a4d 0%,#071527 55%,#030b16 100%);cursor:pointer;perspective:1100px;overflow:hidden;animation:portalIntroBg 4.6s ease-out forwards}
.portalIntro--leaving{animation:portalIntroOut .9s ease forwards;pointer-events:none}
.portalIntro__scene{position:relative;width:190px;height:190px;transform-style:preserve-3d;animation:portalIntroOrbit 4.2s cubic-bezier(.35,.9,.4,1) forwards}
.portalIntro__badge{position:absolute;inset:0;transform-style:preserve-3d;animation:portalIntroFlip 2.6s cubic-bezier(.3,1.1,.4,1) forwards,portalIntroHover 2.6s 1.4s ease-in-out infinite alternate}
.portalIntro__badgeFace{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:50%;backface-visibility:hidden;background:linear-gradient(150deg,#f8fbff,#cfe0f2 60%,#9fbcd8);box-shadow:0 24px 60px rgba(2,12,26,.55),0 0 0 1px rgba(255,255,255,.35) inset}
.portalIntro__badgeFace img{width:74%;height:74%;object-fit:contain;border-radius:50%}
.portalIntro__badgeFace--back{transform:rotateY(180deg);color:#0d2a4d;font-size:2.6rem;font-weight:800;letter-spacing:.08em;display:none}
.portalIntro__ring{position:absolute;inset:-26px;border-radius:50%;border:2px solid rgba(120,190,255,.5);transform:rotateX(72deg);animation:portalIntroRing 2.8s cubic-bezier(.2,.8,.3,1) forwards}
.portalIntro__ring--second{inset:-48px;border-color:rgba(120,190,255,.22);animation-delay:.35s}
.portalIntro__wordmark{display:flex;gap:.45em;font-size:clamp(1.5rem,6vw,2.4rem);font-weight:800;color:#eef6ff;perspective:600px}
.portalIntro__word{display:inline-block;opacity:0;transform:translateY(26px) rotateX(75deg);animation:portalIntroWord .9s cubic-bezier(.2,.9,.3,1.2) forwards}
.portalIntro__word:nth-child(1){animation-delay:1.35s}
.portalIntro__word:nth-child(2){animation-delay:1.6s}
.portalIntro__word:nth-child(3){animation-delay:1.85s;text-shadow:0 2px 24px rgba(96,180,255,.55)}
.portalIntro__sub{margin:0;color:#8fbede;font-size:.95rem;letter-spacing:.18em;text-transform:uppercase;opacity:0;animation:portalIntroSub 1s 2.5s ease forwards}
.portalIntro__skip{position:absolute;right:18px;bottom:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#cfe4f6;padding:.45rem 1.1rem;border-radius:999px;font-size:.85rem;opacity:0;animation:portalIntroSub .6s 1s ease forwards}
@keyframes portalIntroBg{from{filter:brightness(.4)}to{filter:brightness(1)}}
@keyframes portalIntroOrbit{0%{transform:rotateY(-30deg) rotateX(14deg) translateZ(-140px) scale(.6)}55%{transform:rotateY(22deg) rotateX(-8deg) translateZ(0) scale(1)}100%{transform:rotateY(0deg) rotateX(6deg) translateZ(0) scale(1.04)}}
@keyframes portalIntroFlip{0%{transform:rotateY(540deg) scale(.4);opacity:0}60%{transform:rotateY(20deg) scale(1);opacity:1}100%{transform:rotateY(0deg) scale(1);opacity:1}}
@keyframes portalIntroHover{from{transform:rotateY(-14deg) rotateZ(-3deg)}to{transform:rotateY(14deg) rotateZ(3deg)}}
@keyframes portalIntroRing{0%{transform:rotateX(72deg) scale(.35);opacity:0}45%{opacity:.9}100%{transform:rotateX(72deg) scale(1.15) rotateZ(180deg);opacity:.15}}
@keyframes portalIntroWord{to{opacity:1;transform:none}}
@keyframes portalIntroSub{to{opacity:1}}
@keyframes portalIntroOut{to{opacity:0;transform:scale(1.18);filter:blur(6px)}}
</style>
<div class="portalIntro" id="portalIntro" role="presentation">
  <div class="portalIntro__scene">
    <div class="portalIntro__ring"></div>
    <div class="portalIntro__ring portalIntro__ring--second"></div>
    <div class="portalIntro__badge"><div class="portalIntro__badgeFace portalIntro__badgeFace--front"><img src="/public-school-logo.webp" alt=""></div><div class="portalIntro__badgeFace portalIntro__badgeFace--back"><span>WTS</span></div></div>
  </div>
  <div class="portalIntro__wordmark"><span class="portalIntro__word">Way</span> <span class="portalIntro__word">to</span> <span class="portalIntro__word">Success</span></div>
  <p class="portalIntro__sub">Standard Schools &middot; Ejigbo</p>
  <button class="portalIntro__skip" type="button" onclick="portalIntroEnd()">Skip</button>
</div>
<script>
(function(){
  var el=document.getElementById('portalIntro');if(!el)return;
  function end(){el.classList.add('portalIntro--leaving');setTimeout(function(){el.remove();},900);}
  el.addEventListener('click',end);
  setTimeout(end,5200);
})();
</script>
<main><a href="portal_core.html?sso=1&handoff=20260911c">Open WTS Result Portal</a></main>
</body>
</html>
